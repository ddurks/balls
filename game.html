<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Balls Golf</title>
    <link rel="icon" href="favicon.ico" />
    <style>
      @font-face {
        font-family: "DrawvidHand";
        src: url("assets/fonts/DrawvidHandwriting.woff2") format("woff2");
        font-display: swap;
      }
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: "DrawvidHand", "Comic Sans MS", cursive, sans-serif;
        background-color: #87cfeb;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none; /* swipes/orbit only — never page pan/zoom */
      }

      /* Boot/loading screen: logo on black until the mode is ready. Sits
         UNDER the door-transition iris (z 99999) so arrivals stay pure. */
      #bootScreen {
        position: fixed;
        inset: 0;
        z-index: 9000;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }
      #bootScreen .boot-logo {
        width: min(70vw, 640px);
        height: auto;
      }
      /* "loading" with favicon balls as the ellipsis dots, rolling in one by
         one, then the row clears and repeats. */
      .boot-loading {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #e8f2e8;
        font:
          bold 22px "DrawvidHand",
          "Comic Sans MS",
          cursive,
          sans-serif;
        letter-spacing: 1px;
      }
      .boot-dot {
        width: 20px;
        height: 20px;
        opacity: 0;
        animation: 1.8s linear infinite;
      }
      .boot-dot:nth-of-type(1) {
        animation-name: bootDot1;
      }
      .boot-dot:nth-of-type(2) {
        animation-name: bootDot2;
      }
      .boot-dot:nth-of-type(3) {
        animation-name: bootDot3;
      }
      @keyframes bootDot1 {
        0%,
        10% {
          opacity: 0;
          transform: translateX(-18px) rotate(-200deg);
        }
        25%,
        88% {
          opacity: 1;
          transform: none;
        }
        94%,
        100% {
          opacity: 0;
          transform: none;
        }
      }
      @keyframes bootDot2 {
        0%,
        30% {
          opacity: 0;
          transform: translateX(-18px) rotate(-200deg);
        }
        45%,
        88% {
          opacity: 1;
          transform: none;
        }
        94%,
        100% {
          opacity: 0;
          transform: none;
        }
      }
      @keyframes bootDot3 {
        0%,
        50% {
          opacity: 0;
          transform: translateX(-18px) rotate(-200deg);
        }
        65%,
        88% {
          opacity: 1;
          transform: none;
        }
        94%,
        100% {
          opacity: 0;
          transform: none;
        }
      }

      /* Swipe overlay canvas */
      #swipeOverlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }

      /* ── UI scale CSS variables (defaults for 1x; JS overrides for small screens) ── */
      :root {
        --ui-size: 150px;
        --ui-margin: 15px;
        --ui-border-width: 6px;
        --ui-btn-size: 40px;
        --ui-gap: 12px;
        --ui-mb-flag: 4px;
        --ui-flag-w: 112px;
        --ui-flag-h: 88px;
        --ui-pin-fs: 36px;
        --ui-yardage-fs: 28px;
        --ui-wind-fs: 32px;
        --ui-power-emoji-fs: 44px;
        --ui-power-fs: 26px;
        --ui-power-gap: 2px;
        --ui-club-btn-fs: 24px;
        --ui-club-icon-fs: 64px;
        --ui-club-name-fs: 24px;
        --ui-club-dist-fs: 12px;
      }

      /* ── Shared circle shape ── */
      .ui-circle {
        width: var(--ui-size);
        height: var(--ui-size);
        background: rgba(144, 200, 150, 0.85);
        border: var(--ui-border-width) solid #476a23;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      /* ── Positioned circles (hidden until JS shows them) ── */
      #circleStats {
        position: absolute;
        top: var(--ui-margin);
        left: var(--ui-margin);
        z-index: 1500;
      }
      #circlePower {
        position: absolute;
        bottom: var(--ui-margin);
        left: var(--ui-margin);
        z-index: 1500;
        display: none;
      }
      #circleClub {
        z-index: 1000;
      }

      /* ── Compass wrapper (column: circle + wind speed) ── */
      .compass-wrapper {
        position: absolute;
        top: var(--ui-margin);
        right: var(--ui-margin);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--ui-gap);
        z-index: 1500;
        pointer-events: none;
      }
      #compassCircle {
        display: none;
        pointer-events: auto;
      }
      .compass-svg {
        width: var(--ui-size);
        height: var(--ui-size);
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      .compass-label {
        fill: #ffeb3b;
        font-size: 28px;
        font-weight: bold;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.8));
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      .compass-center {
        fill: #ffeb3b;
      }
      .wind-arrow-poly {
        fill: #ff6b6b;
        stroke: #e1e44e;
        stroke-width: 1.5;
      }
      #windSpeedDisplay {
        color: #e1e44e;
        font-size: var(--ui-wind-fs);
        font-weight: bold;
        font-family: "DrawvidHand", "Comic Sans MS", cursive, sans-serif;
        pointer-events: auto;
        display: none;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }

      /* ── Club selector: L-shaped corner layout — the selected club sits in the
         corner, the previous club directly above it, and the next club to its
         left (a right angle around the corner) to save space. ── */
      .club-wrapper {
        position: absolute;
        bottom: 6px;
        right: 6px;
        width: calc(var(--ui-size) * 1.5 + var(--ui-gap));
        height: calc(var(--ui-size) * 1.5 + var(--ui-gap));
        z-index: 1000;
        pointer-events: none;
      }
      #clubPrev,
      #circleClub,
      #clubNext {
        display: none;
        position: absolute;
        pointer-events: auto;
      }
      #circleClub {
        right: 0;
        bottom: 0;
        z-index: 1002;
      }
      #clubPrev {
        top: 0;
        right: calc(var(--ui-size) * 0.06);
        z-index: 1001;
      }
      #clubNext {
        left: 0;
        bottom: calc(var(--ui-size) * 0.06);
        z-index: 1001;
      }
      /* half-size preview circles for the previous / next club (a 3-club carousel) */
      .club-mini {
        /* EXACT 0.5× copy of .ui-circle (same bg, half the border) so scaling a
           mini up to the selected size is pixel-identical — no swap "snap". */
        width: calc(var(--ui-size) * 0.5);
        height: calc(var(--ui-size) * 0.5);
        background: rgba(144, 200, 150, 0.85);
        border: calc(var(--ui-border-width) * 0.5) solid #476a23;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        pointer-events: auto;
        overflow: hidden;
        position: relative;
        touch-action: manipulation;
        will-change: transform;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      .club-mini:active {
        background: rgba(100, 160, 110, 0.9);
      }
      /* Icon on top, abbreviation in the middle, yardage at the bottom — all
         CENTRED horizontally so nothing clips at the round edge. Selected badges
         are exactly 2× the mini's, so a mini scaled up to the selected size is
         pixel-identical (no swap "snap"). */
      .club-mini-icon {
        position: absolute;
        top: 9%;
        left: 0;
        right: 0;
        margin: 0 auto;
        width: 44%;
        height: 40%;
        object-fit: contain;
        pointer-events: none;
      }
      .club-mini-abbr,
      .club-sel-abbr {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 30%;
        text-align: center;
        color: #e1e44e;
        font-family: "DrawvidHand", "Comic Sans MS", cursive, sans-serif;
        font-weight: bold;
        line-height: 1;
        pointer-events: none;
        text-shadow:
          0 0 3px rgba(0, 0, 0, 0.9),
          1px 1px 2px rgba(0, 0, 0, 1);
      }
      .club-mini-abbr {
        font-size: calc(var(--ui-size) * 0.13);
      }
      .club-sel-abbr {
        font-size: calc(var(--ui-size) * 0.26);
      }
      .club-mini-yds,
      .club-sel-yds {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 9%;
        text-align: center;
        color: #f4f8ff;
        font-family: "DrawvidHand", "Comic Sans MS", cursive, sans-serif;
        font-weight: bold;
        line-height: 1;
        pointer-events: none;
        text-shadow:
          0 0 3px rgba(0, 0, 0, 0.9),
          1px 1px 2px rgba(0, 0, 0, 1);
      }
      .club-mini-yds {
        font-size: calc(var(--ui-size) * 0.055);
      }
      .club-sel-yds {
        font-size: calc(var(--ui-size) * 0.11);
      }

      /* ── Stats circle content ── */
      .circle-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: "DrawvidHand", "Comic Sans MS", cursive, sans-serif;
        text-align: center;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      .flag-wrapper {
        position: relative;
        width: var(--ui-flag-w);
        height: var(--ui-flag-h);
        margin-bottom: var(--ui-mb-flag);
      }
      .flag-img {
        width: 100%;
        height: 100%;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      .pin-number {
        position: absolute;
        top: 20%;
        left: 15%;
        color: #e1e44e;
        font-weight: bold;
        font-size: var(--ui-pin-fs);
        text-shadow:
          0 0 4px rgba(0, 0, 0, 0.9),
          1px 1px 2px rgba(0, 0, 0, 1);
      }
      .yardage-display {
        color: #e1e44e;
        font-weight: bold;
        font-size: var(--ui-yardage-fs);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }
      .stats-par {
        color: #e1e44e;
        font-weight: bold;
        font-size: calc(var(--ui-size) * 0.115);
        margin-top: -8px;
        margin-bottom: 0;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }

      /* ── Power circle content ── */
      .power-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--ui-size);
        height: var(--ui-size);
        transform: rotate(90deg);
      }
      #powerArc {
        transition:
          stroke-dashoffset 0.1s ease-out,
          stroke 0.1s ease-out;
      }
      .power-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--ui-power-gap);
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      .power-emoji {
        font-size: var(--ui-power-emoji-fs);
        line-height: 1;
      }
      .power-text {
        color: #e1e44e;
        font-weight: bold;
        font-family: "DrawvidHand", "Comic Sans MS", cursive, sans-serif;
        font-size: var(--ui-power-fs);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }

      /* ── Glass bubble overlay ── */
      .glass-circle {
        overflow: hidden;
        transition:
          transform 0.08s ease,
          filter 0.08s ease;
      }
      .glass-circle::after {
        content: "";
        position: absolute;
        top: 5%;
        left: 10%;
        width: 80%;
        height: 50%;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at 38% 30%,
          rgba(255, 255, 255, 0.62) 0%,
          rgba(255, 255, 255, 0.28) 45%,
          rgba(255, 255, 255, 0.06) 70%,
          transparent 100%
        );
        pointer-events: none;
        z-index: 20;
        transform: rotate(-10deg);
        transition:
          top 0.08s ease,
          background 0.08s ease;
      }
      .glass-circle.pressed {
        background: rgba(100, 160, 110, 0.95) !important;
      }
      .glass-circle.pressed::after {
        top: 10%;
        background: radial-gradient(
          ellipse at 38% 42%,
          rgba(255, 255, 255, 0.35) 0%,
          rgba(255, 255, 255, 0.12) 45%,
          transparent 70%
        );
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="bootScreen">
      <img class="boot-logo" src="assets/balls_golf.png" alt="Balls Golf" />
      <div class="boot-loading">
        loading
        <img class="boot-dot" src="favicon.ico" alt="" />
        <img class="boot-dot" src="favicon.ico" alt="" />
        <img class="boot-dot" src="favicon.ico" alt="" />
      </div>
    </div>

    <!-- Babylon.js and dependencies (local with CDN fallback) -->
    <script>
      // Load scripts sequentially: Babylon → Havok → Game
      const scriptChain = [
        {
          local: "babylon/babylon.js",
          cdn: "https://cdn.babylonjs.com/babylon.js",
        },
        {
          local: "babylon/babylonjs.loaders.min.js",
          cdn: "https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js",
        },
        {
          local: "babylon/babylonjs.materials.min.js",
          cdn: "https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js",
        },
        {
          local: "babylon/HavokPhysics_umd.js",
          cdn: "https://cdn.babylonjs.com/havok/HavokPhysics_umd.js",
        },
      ];

      let chainIndex = 0;

      function loadNextInChain() {
        if (chainIndex >= scriptChain.length) {
          // All dependencies loaded, now load game script
          loadGameScript();
          return;
        }

        const { local, cdn } = scriptChain[chainIndex];
        const script = document.createElement("script");

        script.onload = () => {
          chainIndex++;
          loadNextInChain();
        };

        script.onerror = () => {
          if (local) {
            console.log(`Local ${local} not found, using CDN...`);
            script.src = cdn;
            script.onerror = null;
            script.onload = () => {
              chainIndex++;
              loadNextInChain();
            };
            document.head.appendChild(script);
          } else {
            console.error("Failed to load script", cdn);
          }
        };

        script.src = local || cdn;
        document.head.appendChild(script);
      }

      // Load same-origin scripts in sequence, each after the previous onload.
      function loadLocalScripts(srcs) {
        let i = 0;
        (function next() {
          if (i >= srcs.length) return;
          const s = document.createElement("script");
          s.src = srcs[i++];
          s.onload = next;
          document.head.appendChild(s);
        })();
      }
      function loadGameScript() {
        // Shared helper modules load (in order) before game.js.
        loadLocalScripts([
          "src/shared/shared.js",
          "src/shared/balls.js",
          "src/shared/materials.js",
          "src/shared/style.js",
          // game.js split into per-system modules; order matters only for
          // load-time refs (config before physics), and game.js (bootstrap) last.
          "src/game/config.js",
          "src/game/utils.js",
          "src/game/wind.js",
          "src/game/clouds.js",
          "src/game/birds.js",
          "src/game/slopearrows.js",
          "src/game/clubs.js",
          "src/game/aim.js",
          "src/game/physics.js",
          "src/game/character.js",
          "src/game/camera.js",
          "src/game/terrain.js",
          "src/game/input.js",
          "src/game/ui.js",
          "src/game/coordinators.js",
          "src/game/scene.js",
          "src/game/golfnet.js",
          "src/game/course.js",
          "src/game/game.js",
        ]);
      }

      // Start the chain
      loadNextInChain();
    </script>
    <!-- Stats Circle (top-left): yardage to pin -->
    <div id="circleStats" class="ui-circle glass-circle">
      <div class="circle-content">
        <div class="flag-wrapper">
          <div id="statsFlagImg" class="flag-img"></div>
          <div id="statsPinNumber" class="pin-number">1</div>
        </div>
        <div id="statsPar" class="stats-par" style="display: none">PAR 4</div>
        <div class="yardage-display"><span id="circleYardage">0</span>'</div>
      </div>
    </div>

    <!-- Compass Circle (top-right): wind direction + speed -->
    <div id="circleCompass" class="compass-wrapper">
      <div id="compassCircle" class="ui-circle glass-circle">
        <svg id="compassSvg" class="compass-svg" viewBox="0 0 120 120">
          <text
            x="60"
            y="18"
            text-anchor="middle"
            dominant-baseline="middle"
            class="compass-label"
          >
            N
          </text>
          <text
            x="102"
            y="65"
            text-anchor="middle"
            dominant-baseline="middle"
            class="compass-label"
          >
            E
          </text>
          <text
            x="60"
            y="108"
            text-anchor="middle"
            dominant-baseline="middle"
            class="compass-label"
          >
            S
          </text>
          <text
            x="18"
            y="65"
            text-anchor="middle"
            dominant-baseline="middle"
            class="compass-label"
          >
            W
          </text>
          <circle cx="60" cy="60" r="4" class="compass-center" />
          <g id="windArrow">
            <polygon
              id="windArrowPolygon"
              points="60,28 55,48 58,45 58,60 62,60 62,45 65,48"
              class="wind-arrow-poly"
            />
          </g>
        </svg>
      </div>
      <div id="windSpeedDisplay" class="wind-speed">0 mph</div>
    </div>

    <!-- Power Circle (bottom-left): swing power arc -->
    <div id="circlePower" class="ui-circle glass-circle">
      <svg id="powerSvg" class="power-svg" viewBox="0 0 150 150">
        <circle
          cx="75"
          cy="75"
          r="61"
          fill="none"
          stroke="rgba(255,255,255,0.15)"
          stroke-width="8"
        />
        <circle
          id="powerArc"
          cx="75"
          cy="75"
          r="61"
          fill="none"
          stroke="#E1E44E"
          stroke-width="8"
          stroke-linecap="round"
          stroke-dasharray="383"
          stroke-dashoffset="383"
        />
      </svg>
      <div class="power-content">
        <div class="power-emoji">💪</div>
        <div class="power-text"><span id="powerPercent">0</span>%</div>
      </div>
    </div>

    <!-- Club Selector (bottom-right): club up/down buttons + circle -->
    <div id="clubSelectorWrapper" class="club-wrapper">
      <div id="clubPrev" class="club-mini glass-circle">
        <img
          class="club-mini-icon"
          src="assets/clubs/iron.png"
          alt="previous club"
        />
        <span class="club-mini-yds"></span>
        <span class="club-mini-abbr"></span>
      </div>
      <div id="circleClub" class="ui-circle glass-circle">
        <img
          id="clubIcon"
          class="club-mini-icon"
          src="assets/clubs/driver.png"
          alt="selected club"
        />
        <span id="clubYds" class="club-sel-yds"></span>
        <span id="clubAbbr" class="club-sel-abbr">D</span>
      </div>
      <div id="clubNext" class="club-mini glass-circle">
        <img
          class="club-mini-icon"
          src="assets/clubs/iron.png"
          alt="next club"
        />
        <span class="club-mini-yds"></span>
        <span class="club-mini-abbr"></span>
      </div>
    </div>
  </body>
</html>
