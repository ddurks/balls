<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balls Clubhouse</title>
    <link rel="icon" href="favicon.ico" />
    <style>
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #87cfeb;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      /* Layer that holds floating nametags + chat bubbles (positioned by JS) */
      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="overlay"></div>

    <!-- Babylon core + GLTF loaders (no Havok: the clubhouse is physics-free). -->
    <script>
      const scriptChain = [
        { local: "babylon/babylon.js", cdn: "https://cdn.babylonjs.com/babylon.js" },
        {
          local: "babylon/babylonjs.loaders.min.js",
          cdn: "https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js",
        },
      ];
      let chainIndex = 0;
      // Load same-origin scripts in sequence, each after the previous onload.
      function loadLocalScripts(srcs) {
        let i = 0;
        (function next() {
          if (i >= srcs.length) return;
          const s = document.createElement("script");
          s.src = srcs[i++];
          s.onload = next;
          document.head.appendChild(s);
        })();
      }
      function loadNextInChain() {
        if (chainIndex >= scriptChain.length) {
          // Shared helper modules load (in order) before the mode script.
          loadLocalScripts(["shared.js", "balls.js", "materials.js", "clubhouse.js"]);
          return;
        }
        const { local, cdn } = scriptChain[chainIndex];
        const script = document.createElement("script");
        script.onload = () => {
          chainIndex++;
          loadNextInChain();
        };
        script.onerror = () => {
          if (local) {
            console.log(`Local ${local} not found, using CDN...`);
            script.src = cdn;
            script.onerror = null;
            script.onload = () => {
              chainIndex++;
              loadNextInChain();
            };
            document.head.appendChild(script);
          } else {
            console.error("Failed to load script", cdn);
          }
        };
        script.src = local || cdn;
        document.head.appendChild(script);
      }
      loadNextInChain();
    </script>
  </body>
</html>
