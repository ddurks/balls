name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI runs unit/lint/format only — no headless browser tests — so skip
      # puppeteer's ~150 MB Chromium download to keep installs fast.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      # checkJs over the game code (src/). Green after declaring the cross-module
      # globals in globals.d.ts. Turning on strictNullChecks/noImplicitAny (~1000+
      # more errors) is a separate, larger typing pass.
      - name: Typecheck
        run: npm run typecheck
